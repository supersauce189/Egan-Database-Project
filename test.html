<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Dropdown</title>
  <style>
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .dropdown-trigger {
      transition: background-color 0.3s ease;
    }

    .dropdown-menu {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.5s ease-out, opacity 0.5s ease-out;
    }

    .dropdown-menu.open {
      max-height: 300px; /* Adjust to fit the number of items */
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="dropdown-container">
        <p class="dropdown-trigger">Click me to see more</p>
        <ul class="dropdown-menu">
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
        </ul>
    </div>
  </div>
  <script>
    document.querySelector('.dropdown-trigger').addEventListener('click', () => {
      const menu = document.querySelector('.dropdown-menu');
      menu.classList.toggle('open');
    });
  </script>
</body>
</html>
